name: checks

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs the unit tests in main.rs, markdown.rs and date.rs, and the
      # fixture tests in tests/fixtures.rs against the committed producer PDFs.
      - run: cargo test
      # The library must not need clap. Nothing in src/ outside main.rs
      # mentions it, and this is what keeps that true — a stray `use clap`
      # in the library would compile fine under the default features and
      # only break for the consumers who care.
      #
      # `check`, not `test`: the integration tests reach for
      # CARGO_BIN_EXE_pdf_annotation_extractor, which does not exist when the
      # binary is skipped.
      - run: cargo check --no-default-features

  # The declared rust-version is a promise; check it holds rather than
  # discovering otherwise from a bug report.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --all-targets

  # The playground is a consumer of this crate, compiled to wasm32 with
  # `default-features = false`. It catches what the fixture suite cannot: a
  # library that quietly needs clap, a dependency that will not build for the
  # browser, a type a caller needs that was never made public. Checked on every
  # PR; only built and published from main, in pages.yml.
  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: playground
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
